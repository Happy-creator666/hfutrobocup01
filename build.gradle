buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/jcenter/'}
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:2.2.3'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }        
}
plugins {
  id 'java'
}

defaultTasks 'build'

group = 'com.github.roborescue'

sourceCompatibility = '17'
targetCompatibility = '17'
version = '4.0'

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/jcenter/'}
    }
}

dependencies {
  implementation fileTree( dir: 'lib', include: '**/*.jar', exclude: '**/*-source.jar' )

  implementation 'com.github.roborescue:rcrs-server:v2.0'
  implementation 'com.github.roborescue:adf-core-java:v4.0'

  implementation 'log4j:log4j:1.2.17'
    implementation 'org.codehaus.groovy:groovy:3.0.18'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

repositories {
  mavenCentral()

  maven {
    url = 'https://sourceforge.net/projects/jsi/files/m2_repo'
  }
  maven {
    url = 'https://repo.enonic.com/public/'
  }
  maven {
    url 'https://jitpack.io'
  }
}

test {
  useJUnitPlatform()
  jvmArgs "-XX:+HeapDumpOnOutOfMemoryError"
}

javadoc {
  options {
    encoding = 'UTF-8'
    addStringOption('Xdoclint:none', '-quiet')
  }
}

clean {
  doFirst {
    delete file( new File( rootDir, 'bin' ) )
    delete file( new File( rootDir, 'build' ) )
    delete file( new File( rootDir, 'precomp_data' ) )
    delete file( new File( rootDir, 'test-results' ) )
  }
}

[compileJava, compileTestJava].each {
  it.options.encoding = 'UTF-8'
  it.options.compilerArgs += [ '-Xlint:unchecked', '-Xlint:deprecation', '-g' ]
}

task launch(type: JavaExec) {
  classpath = files('lib')
  classpath += files('.')
  classpath += sourceSets.main.runtimeClasspath
  mainClass = 'adf.core.Main'
  // Override with -PagentMaxHeap=8G or HFUT_AGENT_MAX_HEAP; preserve the existing default.
  maxHeapSize = providers.gradleProperty('agentMaxHeap')
      .orElse(providers.environmentVariable('HFUT_AGENT_MAX_HEAP')).getOrElse('20G')
  def cacheMode = providers.gradleProperty('precomputeCache')
      .orElse(providers.environmentVariable('HFUT_PRECOMPUTE_CACHE')).getOrElse('true')
  systemProperty 'adf.precompute.read', cacheMode
  doFirst {
    if (!(maxHeapSize ==~ /(?i)[1-9][0-9]*[kmg]?/)) {
      throw new GradleException('agentMaxHeap must be a positive JVM heap size, for example 8G or 2048M')
    }
    if (!(cacheMode in ['true', 'false'])) {
      throw new GradleException('precomputeCache must be true or false')
    }
    logger.lifecycle("Agent JVM: maxHeap=${maxHeapSize}, readPrecomputeCache=${cacheMode}")
  }
}

task testRun(type: JavaExec) {
  classpath = files('lib')
  classpath += files('.')
  classpath += sourceSets.main.runtimeClasspath
  mainClass = 'hfutinvincible2021.tool.targetprovider.PfTargetProvider'
  maxHeapSize = '20G'
}
